<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="netflix.css">
</head>
<body>
    <header>
        <div class=" nav-bar">
            <div class="logo" >

            </div>
        </div>
    </header>
    <div class="center-content">
        <h1 >
            <p class="sign-in"> Sign in</p>
        </h1>
        <div class="box">
             <input type="text" class="box1" placeholder="Email or Phone number">
             <input type="password" class="box2" placeholder="password">
        </div>
        <button class="but-sign">
            <h4>Sign in</h4>
        </button>
        <p class="or">OR</p>
        <button class="sign-in-code">
            Use a sign-in code
        </button>
        <p >
           <a class="password" href="/blank" target="/main">Forgot your password?</a>
        </p>
        <div class="rememberme">
            <input type="checkbox" class="check" id="rememberme">
            <label for="rememberme">Remember me</label>
        </div>
        <p class="new1">New to Netflix? <a class="new" href="\blank" target="\main">sign-up now</a></p>
        <p class="new2">This page is protected by Google reCAPTCHA to ensure<br>you're not a bot.</p>
        <p><a class="learn-more" href="\blank" target="\main">Learn more</a></p>
    </div>
    <footer>
        <div class="footer-content">
            <p class="question">Questions? Call 000-800-040-1843</p>
            <div class="footer-links">
                <a href="\blank" target="\main">FAQ</a>
                <a href="\blank" target="\main">Help Center</a>
                <a href="\blank" target="\main">Terms of Use</a>
                <a href="\blank" target="\main">Privacy</a>
                <a href="\blank" target="\main">Cookie Preferences</a>
                <a href="\blank" target="\main">Corporate Information</a>
            </div>
            <select class="language-select">
                <option value="English">English</option>
                <option value="Hindi">हिंदी</option>
                <option value="Spanish">Español</option>
                <option value="French">Français</option>
        </div>
</body>
</html>
